name: Build Osmantus Halayi APK

on:
  push:
    branches: [ main ]
    paths:
      - 'osmantus-halayi/main.py'
      - 'osmantus-halayi/buildozer.spec'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate project
        run: |
          python -m py_compile osmantus-halayi/main.py
          test -f osmantus-halayi/buildozer.spec
          echo "Source validated"

      - name: Build APK with official Kivy Buildozer image
        run: |
          mkdir -p "$HOME/.buildozer"
          docker pull ghcr.io/kivy/buildozer:latest
          docker run --rm \
            -e PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE=0 \
            -v "$HOME/.buildozer:/home/user/.buildozer" \
            -v "$GITHUB_WORKSPACE/osmantus-halayi:/home/user/hostcwd" \
            ghcr.io/kivy/buildozer:latest android debug
          echo "APK output:"
          find osmantus-halayi/bin -maxdepth 1 -type f -print

      - name: Upload Osmantus Halayi APK
        uses: actions/upload-artifact@v4
        with:
          name: Osmantus-Halayi-APK
          path: osmantus-halayi/bin/*.apk
          if-no-files-found: error
