name: Build Osmantus Halayi APK

on:
  push:
    branches: [ main ]
    paths:
      - 'osmantus-halayi/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack Osmantus Halayi project
        run: |
          rm -rf osmantus-halayi/build-src
          mkdir -p osmantus-halayi/build-src
          base64 -d osmantus-halayi/project.tar.gz.b64 > /tmp/osmantus-halayi.tar.gz
          tar -xzf /tmp/osmantus-halayi.tar.gz -C osmantus-halayi/build-src
          echo "Project files:"
          find osmantus-halayi/build-src -maxdepth 2 -type f -print

      - name: Build APK with official Kivy Buildozer image
        run: |
          mkdir -p "$HOME/.buildozer"
          docker pull ghcr.io/kivy/buildozer:latest
          docker run --rm \
            -e PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE=0 \
            -v "$HOME/.buildozer:/home/user/.buildozer" \
            -v "$GITHUB_WORKSPACE/osmantus-halayi/build-src:/home/user/hostcwd" \
            ghcr.io/kivy/buildozer:latest android debug
          echo "APK output:"
          find osmantus-halayi/build-src/bin -maxdepth 1 -type f -print || true

      - name: Upload Osmantus Halayi APK
        uses: actions/upload-artifact@v4
        with:
          name: Osmantus-Halayi-APK
          path: osmantus-halayi/build-src/bin/*.apk
          if-no-files-found: error
